# MedAgent System Configuration & Hyperparameters

project:
  name: "MedAgent"
  version: "1.0.0"
  description: "Explainable Multimodal Medical Decision Support Agent"

hardware:
  target_gpu: "NVIDIA GeForce RTX 5050 Laptop GPU"
  compute_capability: "sm_120"
  use_cuda: true
  mixed_precision: true

signal_pipeline:
  sampling_rate: 360  # Hz (MIT-BIH Standard)
  lead_name: "MLII"
  window_before_r_peak: 90   # 250ms at 360Hz
  window_after_r_peak: 170   # 472ms at 360Hz
  total_beat_samples: 260    # ~722ms window
  filter:
    lowcut: 0.5   # Hz (Baseline wander removal)
    highcut: 45.0 # Hz (High frequency noise removal)
    order: 4
    notch_freq: 60.0 # Hz (Powerline interference)
    notch_quality: 30.0
  classes:
    0: "Normal (N)"
    1: "Supraventricular Ectopic (S)"
    2: "Ventricular Ectopic (V)"
    3: "Fusion (F)"
    4: "Unknown / Paced (Q)"

imaging_pipeline:
  image_size: 224
  in_channels: 3
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  classes:
    0: "Normal"
    1: "Pneumonia"
    2: "Cardiomegaly"
    3: "Atelectasis"
    4: "Pleural Effusion"

multimodal_fusion:
  ecg_latent_dim: 256
  vision_latent_dim: 1024
  tabular_latent_dim: 64
  transformer_embed_dim: 256
  transformer_heads: 8
  transformer_layers: 3
  risk_classes:
    0: "Low Risk"
    1: "Moderate Risk"
    2: "High / Critical Risk"
